name: jdonuts_test
description: "J'Donuts - Madivizion Flutter code test: fake auth, offline-first catalog, animated rewards."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.2.0
  connectivity_plus: ^7.3.2
  cached_network_image: ^4.0.7
  intl: ^0.20.3
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/seed/
    - assets/images/
